# Release builds: Windows installer and portable zip, macOS dmgs (Apple Silicon
# and Intel) with a Homebrew cask, an AppImage, and a Flatpak bundle and repo.
#
# Runs when a GitHub release is published, and attaches every file to it.
# Pushing a tag like v1.2.3 also cuts the release (with generated notes) and
# then builds it the same way.
# It can also be started by hand (Actions > Release > Run workflow): with a
# release tag it cuts that release and builds it; without one it only tries
# the builds, keeping the files as workflow artifacts.
#
# Optional repository secrets:
#   HOMEBREW_TAP_TOKEN        a token that can push to benwbooth/homebrew-tap;
#                             without it the Homebrew step is skipped
#   FLATPAK_GPG_PRIVATE_KEY   an ASCII-armoured GPG key to sign the Flatpak
#                             repo; without it the repo is unsigned
name: Release

on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Cut a release with this new tag (e.g. v1.2.3) from the chosen branch; leave empty to only try the builds'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

env:
  # The newest Qt 6 release (Windows takes the newest one aqt can install).
  QT_VERSION: '6.*'
  # (qtserialport: Qt Positioning's NMEA plugin needs it)
  QT_MODULES: 'qtwebengine qtwebchannel qtpositioning qtpdf qtserialport'
  AQT_VERSION: '==3.3.*'
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      skip: ${{ steps.v.outputs.skip }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          skip=false
          if [ "${{ github.event_name }}" = release ]; then
            tag='${{ github.event.release.tag_name }}'
            version="${tag#v}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            tag='${{ inputs.release_tag }}'
            version="${tag#v}"
            gh release create "$tag" --target "$GITHUB_SHA" --title "Almanac $version" --generate-notes
          elif [ "${{ github.event_name }}" = push ]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            if gh release view "$tag" >/dev/null 2>&1; then
              # Made on GitHub with this tag: its own release run builds it.
              skip=true
            else
              gh release create "$tag" --verify-tag --title "Almanac $version" --generate-notes
            fi
          else
            tag=""
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)-dev.${{ github.run_number }}"
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Almanac $version"

  windows:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Find the Qt build for MSVC
        id: qt
        shell: bash
        run: |
          pip install -q "aqtinstall$AQT_VERSION"
          # The newest Qt 6 that aqt can read for Windows (it may lag the
          # newest release by a version).
          for v in $(python -m aqt list-qt windows desktop | tr ' ' '\n' | grep '^6\.' | sort -Vr); do
            archs=$(python -m aqt list-qt windows desktop --arch "$v" 2>/dev/null) || continue
            arch=$(tr ' ' '\n' <<<"$archs" | grep -E '^win64_msvc[0-9]+_64$' | sort -V | tail -1)
            [ -n "$arch" ] && break
          done
          echo "Qt $v for Windows ($arch); available: $archs"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "arch=$arch" >> "$GITHUB_OUTPUT"
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ steps.qt.outputs.version }}
          arch: ${{ steps.qt.outputs.arch }}
          modules: ${{ env.QT_MODULES }}
          aqtversion: ${{ env.AQT_VERSION }}
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: pwsh
        run: |
          $env:QMAKE = Join-Path $env:QT_ROOT_DIR 'bin\qmake.exe'
          & $env:QMAKE -query QT_VERSION
          cargo build --release --locked
      - name: Gather Qt and the C++ runtime next to almanac.exe
        shell: pwsh
        run: |
          $dist = 'dist\Almanac'
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item target\release\almanac.exe $dist
          & (Join-Path $env:QT_ROOT_DIR 'bin\windeployqt.exe') --release --qmldir qml --no-compiler-runtime "$dist\almanac.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The Visual C++ runtime, app-local, so nothing else needs installing.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory | Sort-Object FullName | Select-Object -Last 1
          Write-Host "C++ runtime from $($crt.FullName)"
          Copy-Item "$($crt.FullName)\*.dll" $dist
          Get-ChildItem $dist | Format-Table Name, Length
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\Almanac -DestinationPath "dist\Almanac-$env:VERSION-windows-x64-portable.zip"
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=$PWD\dist\Almanac" "/DOutputDir=$PWD\dist" packaging\windows\almanac.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.exe

  macos:
    needs: version
    if: needs.version.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          aqtversion: ${{ env.AQT_VERSION }}
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          "$QMAKE" -query QT_VERSION
          cargo build --release --locked
      - name: App bundle
        run: |
          app=dist/Almanac.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/almanac "$app/Contents/MacOS/almanac"
          cp packaging/icons/almanac.icns "$app/Contents/Resources/almanac.icns"
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          "$QT_ROOT_DIR/bin/macdeployqt" "$app" -qmldir=qml -always-overwrite -verbose=1
          # Not notarized: sign ad hoc so Apple Silicon will run it at all.
          # Inside out: libraries, nested helper apps, frameworks, then the app.
          find "$app/Contents" -type f \( -name '*.dylib' -o -name '*.so' \) -print0 | xargs -0 -n1 codesign --force --sign -
          find "$app/Contents/Frameworks" -depth -type d -name '*.app' -print0 | xargs -0 -n1 codesign --force --sign -
          find "$app/Contents/Frameworks" -depth -type d -name '*.framework' -print0 | xargs -0 -n1 codesign --force --sign -
          codesign --force --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
      - name: Disk image
        run: |
          mkdir dist/dmg
          mv dist/Almanac.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname Almanac -srcfolder dist/dmg -ov -format UDZO \
            "dist/Almanac-$VERSION-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg

  appimage:
    needs: version
    if: needs.version.outputs.skip != 'true'
    # The oldest supported Ubuntu, so the AppImage runs on older systems too.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfuse2 file patchelf pkg-config libgl1-mesa-dev libegl1 libopengl0 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libasound2 \
            libxshmfence1 libgbm1 libcups2
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: ${{ env.QT_MODULES }}
          aqtversion: ${{ env.AQT_VERSION }}
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          "$QMAKE" -query QT_VERSION
          cargo build --release --locked
      - name: AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          base=https://github.com/linuxdeploy
          curl -fsSLo linuxdeploy $base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSLo linuxdeploy-plugin-qt $base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          mkdir -p appimage
          sed -e 's/^Icon=.*/Icon=almanac/' -e '$a StartupWMClass=almanac' \
            packaging/linux/io.github.benwbooth.Almanac.desktop > appimage/almanac.desktop
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export QML_SOURCES_PATHS="$PWD/qml"
          # Wayland first (the X11 plugin comes along by default).
          plugins=""
          for p in libqwayland.so libqwayland-egl.so libqwayland-generic.so; do
            [ -f "$QT_ROOT_DIR/plugins/platforms/$p" ] && plugins="$plugins;$p"
          done
          export EXTRA_PLATFORM_PLUGINS="${plugins#;}"
          export EXTRA_QT_MODULES="svg"
          export OUTPUT="Almanac-$VERSION-x86_64.AppImage"
          ./linuxdeploy --appdir AppDir \
            --executable target/release/almanac \
            --desktop-file appimage/almanac.desktop \
            --icon-file icons/almanac.svg \
            --plugin qt --output appimage
          mkdir -p dist && mv "$OUTPUT" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage

  flatpak:
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APP_ID: io.github.benwbooth.Almanac
      GPG_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder elfutils librsvg2-common
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Pick the KDE runtime
        run: |
          # The newest KDE SDK branch that also has a Qt WebEngine BaseApp.
          sdk=$(flatpak remote-ls --user flathub --runtime --columns=ref | sed -n 's#^runtime/org\.kde\.Sdk/x86_64/\(6\.[0-9]*\)$#\1#p' | sort -u)
          base=$(flatpak remote-ls --user flathub --app --columns=ref | sed -n 's#^app/io\.qt\.qtwebengine\.BaseApp/x86_64/\(6\.[0-9]*\)$#\1#p' | sort -u)
          echo "KDE SDKs: $(echo $sdk)"; echo "WebEngine BaseApps: $(echo $base)"
          kde=$(comm -12 <(echo "$sdk") <(echo "$base") | sort -V | tail -1)
          [ -n "$kde" ] || { echo "no KDE runtime with a WebEngine BaseApp"; exit 1; }
          echo "Using KDE runtime $kde"
          sed "s/@KDE@/$kde/g" packaging/flatpak/$APP_ID.yml > packaging/flatpak/build.yml
      - name: Signing key
        if: env.GPG_KEY != ''
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"; mkdir -m 700 "$GNUPGHOME"
          echo "$GPG_KEY" | gpg --batch --import
          id=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          echo "GPG_ID=$id" >> "$GITHUB_ENV"
      - name: Build
        run: |
          sign=()
          if [ -n "${GPG_ID:-}" ]; then sign=(--gpg-sign="$GPG_ID" --gpg-homedir="$GNUPGHOME"); fi
          flatpak-builder --user --install-deps-from=flathub --force-clean --disable-rofiles-fuse \
            --default-branch=stable --repo=flatpak-repo "${sign[@]}" \
            flatpak-build packaging/flatpak/build.yml
          flatpak build-update-repo --prune --generate-static-deltas "${sign[@]}" flatpak-repo
          mkdir -p dist
          flatpak build-bundle "${sign[@]}" --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo "dist/Almanac-$VERSION-x86_64.flatpak" $APP_ID stable
      - name: Repo files for GitHub Pages
        run: |
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/flatpak"
          site=flatpak-repo
          {
            echo "[Flatpak Repo]"
            echo "Title=Almanac"
            echo "Url=$url/"
            echo "Homepage=https://github.com/$GITHUB_REPOSITORY"
            echo "Comment=Mail, Calendar and Contacts"
            echo "DefaultBranch=stable"
            if [ -n "${GPG_ID:-}" ]; then echo "GPGKey=$(gpg --export "$GPG_ID" | base64 -w0)"; fi
          } > $site/almanac.flatpakrepo
          {
            echo "[Flatpak Ref]"
            echo "Name=$APP_ID"
            echo "Branch=stable"
            echo "Title=Almanac"
            echo "Url=$url/"
            echo "RuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo"
            echo "IsRuntime=false"
            if [ -n "${GPG_ID:-}" ]; then echo "GPGKey=$(gpg --export "$GPG_ID" | base64 -w0)"; fi
          } > $site/almanac.flatpakref
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: dist/*.flatpak
      - name: Pack the repo for the Pages site
        run: tar -C flatpak-repo -czf "dist/flatpak-repo.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-repo
          path: dist/flatpak-repo.tar.gz

  publish:
    # Attaches everything to the release and updates the Homebrew cask.
    if: needs.version.outputs.tag != ''
    needs: [version, windows, macos, appimage, flatpak]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Attach to the release
        run: |
          ls -la dist
          (cd dist && sha256sum * > SHA256SUMS.txt)
          gh release upload "$TAG" dist/* --clobber
          # pages.yml serves the Flatpak repo from that tarball next to the site.
          gh workflow run pages.yml --ref "${{ github.event.repository.default_branch }}"
      - name: Homebrew cask
        if: env.TAP_TOKEN != ''
        run: |
          arm=$(sha256sum "dist/Almanac-$VERSION-macos-arm64.dmg" | cut -d' ' -f1)
          intel=$(sha256sum "dist/Almanac-$VERSION-macos-x86_64.dmg" | cut -d' ' -f1)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@TAG@/$TAG/g" \
              -e "s/@SHA_ARM@/$arm/g" -e "s/@SHA_INTEL@/$intel/g" \
              -e "s#@REPO@#$GITHUB_REPOSITORY#g" \
              packaging/macos/almanac.rb > tap/Casks/almanac.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/almanac.rb
          git commit -m "almanac $VERSION" || { echo "cask unchanged"; exit 0; }
          git push
