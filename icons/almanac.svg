<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Almanac: a letter whose top is a calendar page (mail, calendar and contacts in one) -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#3D8BFF"/>
      <stop offset="1" stop-color="#6A3DF0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9EDFB"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <!-- a soft shadow under the letter (plain shapes: Qt's SVG has no filters) -->
  <rect x="42" y="80" width="172" height="126" rx="20" fill="#1B1460" fill-opacity="0.18"/>
  <rect x="40" y="76" width="176" height="126" rx="19" fill="#1B1460" fill-opacity="0.16"/>
  <g>
    <!-- the letter -->
    <rect x="40" y="70" width="176" height="128" rx="18" fill="url(#paper)"/>
    <!-- its top: a calendar page's coloured band -->
    <path d="M58 70h140a18 18 0 0 1 18 18v12H40V88a18 18 0 0 1 18-18z" fill="#FF6B57"/>
    <!-- the fold -->
    <path d="M50 112l78 52 78-52" fill="none" stroke="#4A63E8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- binder rings -->
  <rect x="84" y="52" width="14" height="36" rx="7" fill="#FFFFFF" stroke="#2B2F7A" stroke-opacity="0.25" stroke-width="2"/>
  <rect x="158" y="52" width="14" height="36" rx="7" fill="#FFFFFF" stroke="#2B2F7A" stroke-opacity="0.25" stroke-width="2"/>
</svg>
